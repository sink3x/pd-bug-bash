<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лист баг-репортов</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 60px; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #16191f; background: #eef1f4; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p { color: #5a626e; margin: 0 0 14px; }
  a { color: #2f6fd6; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: #5a626e; margin: 8px 0 3px; }
  input, select, textarea { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid #d5dbe3; border-radius: 8px; background: #fff; color: #16191f; }
  textarea { min-height: 64px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
  .rep { background: #fff; border: 2px solid #d5dbe3; border-radius: 12px; padding: 12px 14px 14px; margin: 12px 0; }
  .rep.full { border-color: #1e9e6a; }
  .rep .top { display: flex; align-items: center; justify-content: space-between; }
  .rep .num { font-weight: 700; font-size: 17px; }
  .rep .warn { color: #dc3d43; font-size: 12.5px; margin-top: 8px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid #d5dbe3; background: #fff; color: #16191f; padding: 9px 14px; min-height: 42px; }
  button.pri { background: #1e9e6a; border-color: #1e9e6a; color: #fff; font-weight: 700; }
  button.del { border: 0; background: none; color: #5a626e; min-height: 0; padding: 4px 6px; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
  #st { font-weight: 600; }
  details { background: #fff; border: 1px solid #d5dbe3; border-radius: 12px; padding: 10px 14px; margin: 12px 0; }
  summary { cursor: pointer; font-weight: 700; }
  details li { margin: 4px 0; }
  #out { display: none; margin-top: 10px; min-height: 200px; font: 13px/1.4 ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h">Лист баг-репортов</h1>
  <p>Один дефект — одна карточка. Когда время выйдет, нажмите «Скопировать отчёт» и отправьте текст в чат группы. <a id="app" href="../">Открыть приложение</a></p>
  <div class="two">
    <div><label for="team">Номер команды</label><select id="team"></select></div>
    <div><label for="name">Название команды</label><input id="name" placeholder="например, smart-warehouse"></div>
  </div>
  <label for="people">Состав</label><input id="people" placeholder="фамилии через запятую">
  <details>
    <summary>Критерии приёмки (как должно работать)</summary>
    <ul id="crit"></ul>
  </details>
  <div id="list"></div>
  <div class="bar">
    <button id="add">+ Добавить дефект</button>
    <button class="pri" id="copy">Скопировать отчёт</button>
    <span id="st"></span>
  </div>
  <textarea id="out" readonly></textarea>
</div>
<script>
const CRIT = [
  ["1.1", "Имя и фамилия: от 2 до 40 символов, пробелы по краям не считаются"],
  ["1.2", "Группа обязательна, без неё запись не создаётся и видна ошибка"],
  ["1.3", "Только будущая дата, начиная с завтра, и только будний день"],
  ["1.4", "В одном слоте не больше 2 человек, третий видит «Слот занят»"],
  ["1.5", "Один студент не может записаться в один слот дважды"],
  ["1.6", "«Вы записаны» показывается только когда запись создана"],
  ["2.1", "Список по дате, внутри дня по времени: 9:00, 11:00, 14:00, 16:00"],
  ["2.2", "«Отменить» удаляет именно ту запись, в строке которой нажата"],
  ["2.3", "Счётчик «Всего записей» равен числу записей"],
  ["2.4", "После обновления страницы список остаётся таким же"],
  ["2.5", "Дата в списке в формате ДД.ММ.ГГГГ"],
  ["3.1", "Поиск не зависит от регистра"],
  ["3.2", "Пустая строка поиска показывает все записи"],
  ["4.1", "На ширине 360 px нет горизонтальной прокрутки"],
  ["4.2", "Введённое пользователем показывается как обычный текст"],
];
const SEV = ["критично", "важно", "желательно"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const blank = () => ({ c: "", s: "", steps: "", exp: "", got: "" });
let team = new URLSearchParams(location.search).get("team"); if (!/^[1-7]$/.test(team || "")) team = "";
let data = { name: "", people: "", items: [blank()] };
const key = () => "bb-report-" + (team || "x");
function load() { try { const v = JSON.parse(localStorage.getItem(key())); if (v && Array.isArray(v.items)) data = v; } catch (e) {} }
function save() { try { localStorage.setItem(key(), JSON.stringify(data)); } catch (e) {} }
const full = (r) => r.c && r.s && r.steps.trim() && r.exp.trim() && r.got.trim();
const empty = (r) => !r.c && !r.s && !r.steps.trim() && !r.exp.trim() && !r.got.trim();
function status() {
  const used = data.items.filter((r) => !empty(r));
  $("st").textContent = `Дефектов: ${used.length}, заполнено полностью: ${used.filter(full).length}`;
  document.querySelectorAll(".rep").forEach((el, i) => { const r = data.items[i]; el.classList.toggle("full", !!full(r)); el.querySelector(".warn").style.display = !empty(r) && !full(r) ? "block" : "none"; });
}
function render() {
  $("h").textContent = "Лист баг-репортов" + (team ? " · команда " + team : "");
  $("app").href = team ? "../t" + team + "/" : "../";
  $("team").innerHTML = '<option value="">выберите</option>' + [1, 2, 3, 4, 5, 6, 7].map((n) => `<option ${String(n) === team ? "selected" : ""}>${n}</option>`).join("");
  $("name").value = data.name; $("people").value = data.people;
  $("list").innerHTML = data.items.map((r, i) => `
    <div class="rep" data-i="${i}">
      <div class="top"><span class="num">Дефект ${i + 1}</span><button class="del" data-del="${i}" title="Удалить карточку">удалить</button></div>
      <div class="two">
        <div><label>Какой критерий нарушен</label><select data-f="c"><option value="">выберите</option>${CRIT.map(([n, t]) => `<option value="${n}" ${r.c === n ? "selected" : ""}>${n} · ${esc(t)}</option>`).join("")}</select></div>
        <div><label>Важность</label><select data-f="s"><option value="">выберите</option>${SEV.map((t) => `<option ${r.s === t ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      </div>
      <label>Шаги: что сделать, чтобы повторить</label><textarea data-f="steps" placeholder="1. Открыть форму. 2. Ввести… 3. Нажать…">${esc(r.steps)}</textarea>
      <div class="two">
        <div><label>Ожидали</label><input data-f="exp" value="${esc(r.exp)}" placeholder="как должно быть по критерию"></div>
        <div><label>Получили</label><input data-f="got" value="${esc(r.got)}" placeholder="что произошло на самом деле"></div>
      </div>
      <div class="warn">Без критерия, важности, шагов, «ожидали» и «получили» дефект не засчитают</div>
    </div>`).join("");
  status();
}
function report() {
  const used = data.items.filter((r) => !empty(r));
  let t = `Баг-бэш · команда ${team || "?"}${data.name.trim() ? " «" + data.name.trim() + "»" : ""} · вариант ${team || "?"}\n`;
  if (data.people.trim()) t += `Состав: ${data.people.trim()}\n`;
  used.forEach((r, i) => { t += `\n${i + 1}. Критерий ${r.c || "?"} · ${r.s || "важность не указана"}\nШаги: ${r.steps.trim() || "—"}\nОжидали: ${r.exp.trim() || "—"}\nПолучили: ${r.got.trim() || "—"}\n`; });
  return t + `\nВсего дефектов: ${used.length}`;
}
$("list").addEventListener("input", (e) => { const el = e.target.closest(".rep"); if (!el || !e.target.dataset.f) return; data.items[+el.dataset.i][e.target.dataset.f] = e.target.value; save(); status(); });
$("list").addEventListener("click", (e) => { const d = e.target.dataset.del; if (d === undefined) return; data.items.splice(+d, 1); if (!data.items.length) data.items.push(blank()); save(); render(); });
$("add").onclick = () => { data.items.push(blank()); save(); render(); const all = document.querySelectorAll(".rep"); all[all.length - 1].scrollIntoView({ behavior: "smooth", block: "center" }); };
$("name").oninput = (e) => { data.name = e.target.value; save(); };
$("people").oninput = (e) => { data.people = e.target.value; save(); };
$("team").onchange = (e) => { team = e.target.value; history.replaceState(null, "", team ? "?team=" + team : location.pathname); data = { name: data.name, people: data.people, items: [blank()] }; load(); render(); };
$("copy").onclick = async () => {
  const t = report(), out = $("out"); out.value = t;
  try { await navigator.clipboard.writeText(t); $("st").textContent = "Отчёт скопирован. Вставьте его в чат группы."; }
  catch (e) { out.style.display = "block"; out.focus(); out.select(); $("st").textContent = "Выделите текст ниже и скопируйте вручную."; }
};
$("crit").innerHTML = CRIT.map(([n, t]) => `<li><b>${n}</b> ${esc(t)}</li>`).join("");
load(); render();
</script>
</body>
</html>
